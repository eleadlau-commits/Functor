name: Desktop

on:
  pull_request:
    paths: ['desktop/**', 'web/**', 'crates/functor-core/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: functor-desktop-${{ runner.os }}
          path: |
            desktop/target/release/bundle/**/*.deb
            desktop/target/release/bundle/**/*.AppImage
            desktop/target/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.msi
            desktop/target/release/bundle/**/*-setup.exe
          if-no-files-found: warn
