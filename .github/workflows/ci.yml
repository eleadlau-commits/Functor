name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo run --release -p functor-cli -- check examples/sample.fn
      - run: cargo run --release -p functor-cli -- bench examples/sample.fn
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run smoke
        working-directory: web
