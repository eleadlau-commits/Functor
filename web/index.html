<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Functor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="bar">
      <div class="brand"><picture><source srcset="/wordmark-dark.svg" media="(prefers-color-scheme: dark)" /><img class="wordmark" src="/wordmark.svg" alt="Functor" /></picture></div>
      <input id="name" class="name" value="untitled.fn" spellcheck="false" aria-label="File name" />
      <div class="actions">
        <button id="new" title="New file">New</button>
        <button id="open" title="Open a .fn file">Open</button>
        <button id="save" title="Download the .fn file">Save .fn</button>
        <button id="html" title="Download the compiled HTML">HTML</button>
        <button id="dark" title="Read the preview on a dark page. Print and PDF stay light" aria-pressed="false">Dark</button>
        <button id="print" title="Print the preview">Print</button>
        <button id="pdf" class="primary" title="Download a PDF set by Functor">PDF</button>
        <a class="ref-link" href="https://eleadlau-commits.github.io/Functor/reference/" target="_blank" rel="noopener" title="The language reference">Reference</a>
      </div>
      <input id="file" type="file" accept=".fn,text/plain" hidden />
    </header>
    <main class="panes">
      <section class="left">
        <div id="editor" class="editor"></div>
        <div class="problems">
          <div class="problems-head">
            <span id="status" class="status">Loading the compiler…</span>
            <button id="toggle" class="link" aria-expanded="true">Problems</button>
          </div>
          <ul id="list" class="list"></ul>
        </div>
      </section>
      <div class="divider" id="divider" role="separator" aria-orientation="vertical"></div>
      <section class="right">
        <div id="preview" class="preview"></div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
