<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Functor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232f4fb3'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='serif' font-style='italic'>F</text></svg>" />
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="logo">F</span>Functor</div>
      <input id="name" class="name" value="untitled.fn" spellcheck="false" aria-label="File name" />
      <div class="actions">
        <button id="new" title="New file">New</button>
        <button id="open" title="Open a .fn file">Open</button>
        <button id="save" title="Download the .fn file">Save .fn</button>
        <button id="html" title="Download the compiled HTML">HTML</button>
        <button id="print" class="primary" title="Print or save as PDF">PDF</button>
      </div>
      <input id="file" type="file" accept=".fn,text/plain" hidden />
    </header>
    <main class="panes">
      <section class="left">
        <div id="editor" class="editor"></div>
        <div class="problems">
          <div class="problems-head">
            <span id="status" class="status">Loading the compiler…</span>
            <button id="toggle" class="link" aria-expanded="true">Problems</button>
          </div>
          <ul id="list" class="list"></ul>
        </div>
      </section>
      <div class="divider" id="divider" role="separator" aria-orientation="vertical"></div>
      <section class="right">
        <div id="preview" class="preview"></div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
