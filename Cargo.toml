[workspace]
resolver = "2"
members = ["crates/functor-symbols", "crates/functor-math", "crates/functor-paper", "crates/functor-wasm", "crates/functor-cli", "crates/functor-stress"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
