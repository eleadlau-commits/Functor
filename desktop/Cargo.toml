[package]
name = "functor-desktop"
description = "Functor desktop app"
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
functor-paper = { path = "../crates/functor-paper" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
